kind = "web"
previewPath = "/"
title = "سوق بن سليم"
version = "1.0.0"
id = "artifacts/bin-saleem"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25838

[services.development]
run = "pnpm --filter @workspace/bin-saleem run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bin-saleem", "run", "build" ]
publicDir = "artifacts/bin-saleem/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25838"
BASE_PATH = "/"
